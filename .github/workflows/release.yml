# Publishes a GitHub Release when a version tag (v1.2.0) is pushed to the main
# Waqt repository, using that version's section of CHANGELOG.md as the notes.
# Deployed copies never push tags, so this only runs upstream.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG="$(jq -r .version package.json)"
          if [ "${PKG}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} doesn't match package.json version ${PKG}."
            exit 1
          fi
          # The CHANGELOG section for this version, without its heading.
          awk -v v="${VERSION}" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Waqt ${VERSION}" --notes-file /tmp/notes.md
          else
            gh release create "${TAG}" --title "Waqt ${VERSION}" --notes-file /tmp/notes.md --verify-tag
          fi
